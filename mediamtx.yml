# Configuração mínima do MediaMTX
rtmp: yes
hls: yes
hlsAllowOrigin: '*'          # libera CORS para a página no github.io
hlsVariant: lowLatency
webrtc: yes
paths:
  live/meucanal:
    publishUser: publicador
    publishPass: TROQUE_ESTA_SENHA
